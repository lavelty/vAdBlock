name: Bug Report
description: Create a report to help us improve the core extension
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        **Note:** If your issue is about a website detecting the adblocker, or an unblocked ad, please use the `vAssets` repository issue tracker instead!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser Version
      description: e.g. Chrome 116, Edge 116
    validations:
      required: true
